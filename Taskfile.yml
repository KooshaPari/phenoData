version: "3"

tasks:
  default:
    cmds:
      - task: quality

  quality:
    desc: Run all quality checks (fmt, clippy, test, deny)
    cmds:
      - task: fmt
      - task: clippy
      - task: test
      - task: deny

  fmt:
    desc: Check Rust formatting
    cmds:
      - cargo fmt --all -- --check

  clippy:
    desc: Run Clippy with all features
    cmds:
      - cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    desc: Run all tests
    cmds:
      - cargo test --workspace

  deny:
    desc: Run cargo-deny for audit and license checks
    cmds:
      - cargo deny check

  machete:
    desc: Find unused dependencies
    cmds:
      - cargo machete

  docs:
    desc: Build and serve VitePress docs
    dir: docs
    cmds:
      - npm run docs:build

  docs:dev:
    desc: Serve VitePress docs locally
    dir: docs
    cmds:
      - npm run docs:dev

  coverage:
    desc: Measure code coverage (SSOT: see grade.sh for the canonical command).
    cmds:
      - |
        if [[ -f "Cargo.toml" ]]; then
          cargo llvm-cov --workspace --fail-under-lines 85
        elif [[ -f "package.json" ]]; then
          npx jest --coverage --coverageThreshold='{"global":{"branches":85,"functions":85,"lines":85,"statements":85}}'
        elif [[ -f "pyproject.toml" || -f "setup.py" ]]; then
          pytest --cov=src --cov-report=term-missing --cov-fail-under=85
        elif [[ -f "go.mod" ]]; then
          go test -coverprofile=coverage.out -covermode=atomic ./... && go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//' | awk '{exit($1 < 85 ? 1 : 0)}'
        else
          echo "No recognized stack (Cargo.toml / package.json / pyproject.toml / go.mod) found." >&2
          exit 1
        fi
